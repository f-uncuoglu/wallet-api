name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The integration tests run against a real PostgreSQL instance.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WALLET_TEST_DB: Host=localhost;Port=5432;Database=wallet_test;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Wallet.slnx

      - name: Build
        run: dotnet build Wallet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Wallet.slnx --configuration Release --no-build --logger "console;verbosity=normal"
